[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reimbursement-manager"
dynamic = ["version"]
description = "A local-first Windows desktop application for organizing reimbursement materials."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7,<7",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.13,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pyinstaller>=6.0,<7",
]

[project.scripts]
reimbursement-manager = "reimbursement_manager.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "reimbursement_manager.version.__version__"}

[tool.setuptools.package-data]
"reimbursement_manager.ui.styles" = ["*.qss"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
